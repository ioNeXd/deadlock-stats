name: test

on:
  push:
    branches:
      - new-site
  pull_request:
    branches:
      - new-site

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Smoke test public Deadlock API
        run: node scripts/api-smoke.js
