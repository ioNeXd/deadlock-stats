name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    name: Syntax, translations & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check (all JS modules)
        run: node scripts/check-syntax.js

      - name: Validate translations
        run: node scripts/validate-translations.js

      - name: Unit tests
        run: npm test
