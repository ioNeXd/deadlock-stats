<!doctype html>
<html lang="en">
<head>

  <meta name="description" content="Deadlock Stats — modern analytics powered directly by the Deadlock API.">
  <title>Deadlock Stats</title>
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://api.deadlock-api.com" crossorigin>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#/"><span class="brand-mark">D</span><span><strong>DEADLOCK</strong><small>STATS</small></span></a>
      <nav class="nav">
        <span class="nav-label">OVERVIEW</span>
        <a class="nav-item active" href="#/">Dashboard</a>
        <a class="nav-item" href="#/matches">Matches</a>
        <a class="nav-item" href="#/players">Players</a>
        <span class="nav-label">GAME</span>

      <div id="page-content"></div>

  <script type="module" src="src/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
