<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deadlock Stats</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
  <div class="title-row">
    <h1 data-i18n="site_title">Deadlock Stats</h1>
    <span id="last-updated" class="last-updated" data-i18n="loading">Loading...</span>
    <div class="lang-switcher" id="lang-switcher">
  <button id="lang-toggle" aria-haspopup="true" aria-expanded="false"></button>
  <ul id="lang-menu" class="lang-menu hidden"></ul>
</div>
  </div>
  <nav>
    <a href="#" id="nav-heroes" data-i18n="nav_heroes">Heroes</a>
    <a href="#" id="nav-items" data-i18n="nav_items">Items</a>
  </nav>
</header>
    <main>
      <table id="stats-table">
        <thead>
          <tr>
            <th></th>
            <th id="table-name-header" data-i18n="table_hero">Hero</th>
            <th
              id="header-winrate"
              data-i18n="table_winrate"
              style="cursor: pointer"
            >
              Win Rate
            </th>
            <th
              id="header-pickrate"
              data-i18n="table_pickrate"
              style="cursor: pointer"
            >
              Pick Rate
            </th>
          </tr>
        </thead>
        <tbody id="stats-table-body"></tbody>
      </table>
    </main>

    <footer>
      <p data-i18n="footer_credit">Data provided by deadlock-api.com</p>
    </footer>

    <script src="js/i18n.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/table.js"></script>
  </body>
</html>
